<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>邮箱配置交互Demo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .preset-btn.active { border-color: #3b82f6; background-color: #eff6ff; color: #1d4ed8; }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

    <div class="bg-white w-full max-w-md rounded-xl shadow-lg p-6 space-y-5">
        <div class="flex justify-between items-center border-b pb-3">
            <h2 class="text-lg font-bold text-gray-800">邮箱通知配置</h2>
            <button class="text-gray-400 hover:text-gray-600">&times;</button>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">快捷服务商</label>
            <div class="grid grid-cols-3 gap-2">
                <button onclick="applyPreset('qq')" class="preset-btn border rounded-md py-2 text-sm hover:bg-gray-50 transition">QQ邮箱</button>
                <button onclick="applyPreset('netease')" class="preset-btn border rounded-md py-2 text-sm hover:bg-gray-50 transition">163邮箱</button>
                <button onclick="applyPreset('custom')" class="preset-btn border rounded-md py-2 text-sm hover:bg-gray-50 transition active">自定义</button>
            </div>
        </div>

        <div class="grid grid-cols-3 gap-4">
            <div class="col-span-2">
                <label class="block text-sm font-medium text-gray-700 mb-1 font-bold text-red-500">发信服务器 *</label>
                <input type="text" id="server" placeholder="smtp.xxx.com" class="w-full border rounded-md px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">端口</label>
                <input type="number" id="port" value="25" class="w-full border rounded-md px-3 py-2 text-sm outline-none">
            </div>
        </div>

        <div class="flex items-center justify-between bg-gray-50 p-3 rounded-lg">
            <div>
                <span class="text-sm font-medium text-gray-700">SSL/TLS 安全加密</span>
                <p class="text-xs text-gray-500">开启后将使用安全连接</p>
            </div>
            <label class="relative inline-flex items-center cursor-pointer">
                <input type="checkbox" id="sslToggle" class="sr-only peer" onchange="toggleSSL(this.checked)">
                <div class="w-11 h-6 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-blue-600"></div>
            </label>
        </div>

        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">发信邮箱账号 *</label>
                <input type="email" id="email" placeholder="example@mail.com" class="w-full border rounded-md px-3 py-2 text-sm outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">邮箱授权码 *</label>
                <div class="relative">
                    <input type="password" id="pwd" placeholder="请输入SMTP授权码" class="w-full border rounded-md px-3 py-2 text-sm outline-none">
                    <p class="mt-1 text-[11px] text-gray-400">* 请在邮箱设置中开启SMTP服务并获取授权码</p>
                </div>
            </div>
        </div>

        <div class="flex gap-3 pt-4 border-t">
            <button onclick="testConnection()" class="flex-1 px-4 py-2 border border-blue-500 text-blue-600 text-sm font-medium rounded-md hover:bg-blue-50 transition">测试连接</button>
            <button class="flex-1 px-4 py-2 bg-blue-600 text-white text-sm font-medium rounded-md hover:bg-blue-700 transition">保存配置</button>
        </div>
    </div>

    <script>
        const serverInput = document.getElementById('server');
        const portInput = document.getElementById('port');
        const sslToggle = document.getElementById('sslToggle');

        const presets = {
            qq: { server: 'smtp.qq.com', port: 465, ssl: true },
            netease: { server: 'smtp.163.com', port: 465, ssl: true },
            custom: { server: '', port: 25, ssl: false }
        };

        function applyPreset(type) {
            const data = presets[type];
            serverInput.value = data.server;
            portInput.value = data.port;
            sslToggle.checked = data.ssl;
            
            // 更新按钮样式
            document.querySelectorAll('.preset-btn').forEach(btn => {
                btn.classList.remove('active');
                if(btn.innerText.toLowerCase().includes(type === 'netease' ? '163' : type)) {
                    btn.classList.add('active');
                }
            });
        }

        function toggleSSL(checked) {
            portInput.value = checked ? 465 : 25;
        }

        function testConnection() {
            const btn = event.target;
            const originalText = btn.innerText;
            btn.innerText = "测试中...";
            btn.disabled = true;

            // 模拟 API 请求延迟
            setTimeout(() => {
                alert("✅ 测试发送成功！\n请检查 " + document.getElementById('email').value + " 是否收到测试邮件。");
                btn.innerText = originalText;
                btn.disabled = false;
            }, 1500);
        }
    </script>
</body>
</html>
