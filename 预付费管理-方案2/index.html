<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>能源预付费管理系统原型 - 原生版</title>
    <style>
        :root {
            --primary-color: #1890ff;
            --danger-color: #ff4d4f;
            --success-color: #52c41a;
            --bg-color: #f0f2f5;
        }

        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; display: flex; height: 100vh; background: var(--bg-color); }
        
        /* 侧边栏 */
        .sidebar { width: 220px; background: #001529; color: rgba(255,255,255,0.65); transition: all 0.3s; }
        .sidebar-header { padding: 20px; color: white; font-weight: bold; border-bottom: 1px solid #002140; font-size: 16px; }
        .menu-item { padding: 15px 20px; cursor: pointer; transition: 0.3s; }
        .menu-item:hover { color: white; background: #1890ff; }
        .menu-item.active { color: white; background: #1890ff; }

        /* 主体内容 */
        .main-container { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .navbar { height: 60px; background: white; box-shadow: 0 1px 4px rgba(0,21,41,.08); display: flex; align-items: center; padding: 0 24px; justify-content: space-between; }
        .content { flex: 1; padding: 24px; overflow-y: auto; }

        /* 面板切换控制 */
        .page-panel { display: none; }
        .page-panel.active { display: block; }

        /* 卡片与表格 */
        .card { background: white; padding: 20px; border-radius: 4px; box-shadow: 0 1px 2px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .card-title { font-size: 16px; font-weight: bold; margin-bottom: 15px; border-left: 4px solid var(--primary-color); padding-left: 10px; }
        
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 12px; border-bottom: 1px solid #f0f0f0; }
        th { background: #fafafa; }

        /* 按钮与开关 */
        .btn { border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-size: 14px; margin-right: 5px; }
        .btn-primary { background: var(--primary-color); color: white; }
        .btn-danger { background: var(--danger-color); color: white; }
        .btn-ghost { background: transparent; border: 1px solid #d9d9d9; }
        .btn:disabled { background: #f5f5f5; color: #b7b7b7; cursor: not-allowed; }

        .switch-container { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; }
        
        /* 状态标签 */
        .badge { padding: 2px 8px; border-radius: 10px; font-size: 12px; }
        .badge-success { background: #f6ffed; border: 1px solid #b7eb8f; color: #52c41a; }
        .badge-error { background: #fff1f0; border: 1px solid #ffa39e; color: #cf1322; }

        /* 模块未启用遮罩样式 */
        .disabled-layer { opacity: 0.5; pointer-events: none; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-header">能源管理后台</div>
        <div class="menu-item active" onclick="switchPage('recharge')">预付费充值管理</div>
        <div class="menu-item" onclick="switchPage('config')">通知服务配置</div>
        <div class="menu-item" onclick="switchPage('remote')">远程控制与催缴</div>
    </div>

    <div class="main-container">
        <div class="navbar">
            <span id="page-title">预付费充值管理</span>
            <div>
                <span style="font-size: 14px; margin-right: 20px;">模块授权：<b id="auth-tag" style="color: var(--success-color);">已开启</b></span>
                <span style="font-size: 14px;">短信余量：<b style="color: #faad14;">4520 条</b></span>
            </div>
        </div>

        <div class="content">
            <div id="page-recharge" class="page-panel active">
                <div class="card">
                    <div class="card-title">用户账户概览</div>
                    <table>
                        <thead>
                            <tr>
                                <th>户号</th>
                                <th>用户名</th>
                                <th>当前余额</th>
                                <th>最后充值时间</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="user-list-body">
                            </tbody>
                    </table>
                </div>
            </div>

            <div id="page-config" class="page-panel">
                <div class="card">
                    <div class="card-title">模块授权 (核心控制)</div>
                    <div class="switch-container">
                        <input type="checkbox" id="master-switch" checked onchange="toggleMasterAuth()"> 
                        <label for="master-switch">开启预付费管理模块 (关闭后所有充值、通知、扣费功能失效)</label>
                    </div>
                </div>

                <div id="config-sub-section" class="card">
                    <div class="card-title">短信推送策略</div>
                    <div style="line-height: 2.5;">
                        <div>余额不足提醒（低于20元）：<input type="checkbox" checked></div>
                        <div>欠费提醒通知：<input type="checkbox" checked></div>
                        <div>欠费强制关断通知：<input type="checkbox" checked></div>
                        <div>微信充值授权：<input type="checkbox" checked></div>
                        <p style="color: #8c8c8c; font-size: 12px;">注：短信推送按发送条数收费，当前费率：0.05元/条</p>
                        <button class="btn btn-primary" onclick="alert('配置已保存')">保存配置</button>
                    </div>
                </div>
            </div>

            <div id="page-remote" class="page-panel">
                <div class="card">
                    <div class="card-title">设备远程强制关断</div>
                    <table id="remote-control-table">
                        <thead>
                            <tr>
                                <th>户号</th>
                                <th>电闸状态</th>
                                <th>水阀状态</th>
                                <th>余额状态</th>
                                <th>远程操作</th>
                            </tr>
                        </thead>
                        <tbody id="remote-list-body">
                            </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 模拟数据库
        let userData = [
            { id: '101', name: '张三', balance: 520.50, elec: true, water: true },
            { id: '102', name: '李四', balance: -15.20, elec: false, water: true },
            { id: '103', name: '王五', balance: 5.00, elec: true, water: true }
        ];

        let isAuthOpen = true;

        // 页面切换
        function switchPage(pageId) {
            document.querySelectorAll('.page-panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.menu-item').forEach(m => m.classList.remove('active'));
            
            document.getElementById('page-' + pageId).classList.add('active');
            event.currentTarget.classList.add('active');
            document.getElementById('page-title').innerText = event.currentTarget.innerText;
            
            renderData();
        }

        // 核心开关逻辑
        function toggleMasterAuth() {
            isAuthOpen = document.getElementById('master-switch').checked;
            const tag = document.getElementById('auth-tag');
            const subSection = document.getElementById('config-sub-section');
            
            if(isAuthOpen) {
                tag.innerText = "已开启";
                tag.style.color = "var(--success-color)";
                subSection.classList.remove('disabled-layer');
            } else {
                tag.innerText = "未开启";
                tag.style.color = "var(--danger-color)";
                subSection.classList.add('disabled-layer');
            }
            renderData();
        }

        // 渲染数据
        function renderData() {
            const listBody = document.getElementById('user-list-body');
            const remoteBody = document.getElementById('remote-list-body');
            
            // 渲染充值列表
            listBody.innerHTML = userData.map(u => `
                <tr>
                    <td>${u.id}</td>
                    <td>${u.name}</td>
                    <td style="color: ${u.balance < 0 ? 'red' : 'black'}"><b>¥ ${u.balance.toFixed(2)}</b></td>
                    <td>2026-03-23</td>
                    <td>
                        <button class="btn btn-primary" ${!isAuthOpen ? 'disabled' : ''} onclick="recharge('${u.id}')">WEB端充值</button>
                        <button class="btn btn-ghost" ${!isAuthOpen ? 'disabled' : ''} onclick="alert('查看明细')">账单</button>
                    </td>
                </tr>
            `).join('');

            // 渲染控制列表
            remoteBody.innerHTML = userData.map(u => `
                <tr class="${!isAuthOpen ? 'disabled-layer' : ''}">
                    <td>${u.id} (${u.name})</td>
                    <td><span class="badge ${u.elec ? 'badge-success' : 'badge-error'}">${u.elec ? '通电中' : '已强制断电'}</span></td>
                    <td><span class="badge ${u.water ? 'badge-success' : 'badge-error'}">${u.water ? '供水中' : '已关阀'}</span></td>
                    <td>${u.balance < 0 ? '<span style="color:red">欠费催缴中</span>' : '正常'}</td>
                    <td>
                        <button class="btn ${u.elec ? 'btn-danger' : 'btn-primary'}" onclick="toggleDevice('${u.id}', 'elec')">
                            ${u.elec ? '强制断电' : '恢复供电'}
                        </button>
                        <button class="btn btn-ghost" onclick="alert('已向该用户发送催缴短信')">一键催缴</button>
                    </td>
                </tr>
            `).join('');
        }

        // 交互功能
        function recharge(id) {
            const user = userData.find(u => u.id === id);
            const amt = prompt(`为房号 ${id} 充值，请输入金额:`, "100");
            if(amt && !isNaN(amt)) {
                user.balance += parseFloat(amt);
                alert("充值成功！");
                renderData();
            }
        }

        function toggleDevice(id, type) {
            const user = userData.find(u => u.id === id);
            if(user[type] && !confirm("确定要对该用户进行远程强制断电吗？")) return;
            user[type] = !user[type];
            renderData();
        }

        // 初始化
        window.onload = renderData;
    </script>
</body>
</html>
