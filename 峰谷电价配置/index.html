<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>峰谷电价自定义设置</title>
    <style>
        :root { --primary: #07c160; --peak: #fa5151; --valley: #108ee9; --flat: #ff976a; --bg: #f7f8fa; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); margin: 0; padding-bottom: 50px; }
        
        .container { padding: 15px; }
        .card { background: white; border-radius: 12px; padding: 15px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
        .card-title { font-size: 16px; font-weight: bold; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
        
        /* 24小时时间轴可视化 */
        .time-track { display: flex; height: 30px; border-radius: 15px; overflow: hidden; margin: 20px 0; border: 1px solid #eee; }
        .segment { height: 100%; display: flex; align-items: center; justify-content: center; color: white; font-size: 10px; }
        .seg-peak { background: var(--peak); }
        .seg-flat { background: var(--flat); }
        .seg-valley { background: var(--valley); }

        /* 配置列表 */
        .config-item { display: flex; align-items: center; padding: 12px 0; border-bottom: 1px solid #f2f2f2; }
        .config-item:last-child { border: none; }
        .dot { width: 10px; height: 10px; border-radius: 50%; margin-right: 10px; }
        .type-name { flex: 1; font-size: 14px; }
        .time-range { color: #888; font-size: 12px; margin-right: 10px; }
        .price-input { width: 70px; border: 1px solid #ddd; padding: 4px 8px; border-radius: 4px; text-align: right; color: var(--peak); font-weight: bold; }

        /* 底部操作 */
        .footer-action { position: fixed; bottom: 0; width: 100%; padding: 10px; background: white; box-sizing: border-box; }
        .btn-save { background: var(--primary); color: white; border: none; width: 100%; padding: 12px; border-radius: 8px; font-size: 16px; font-weight: bold; }
        
        .tip { font-size: 12px; color: #999; margin-top: 10px; line-height: 1.5; }
    </style>
</head>
<body>

    <div class="container">
        <div class="card">
            <div class="card-title">当前峰谷分布预估</div>
            <div class="time-track">
                <div class="segment seg-valley" style="width: 33%;">谷 (00-08)</div>
                <div class="segment seg-flat" style="width: 13%;">平 (08-11)</div>
                <div class="segment seg-peak" style="width: 20%;">峰 (11-16)</div>
                <div class="segment seg-flat" style="width: 12%;">平 (16-19)</div>
                <div class="segment seg-peak" style="width: 12%;">峰 (19-22)</div>
                <div class="segment seg-valley" style="width: 10%;">谷</div>
            </div>
            <div style="display: flex; justify-content: space-between; font-size: 10px; color: #999; padding: 0 5px;">
                <span>00:00</span><span>06:00</span><span>12:00</span><span>18:00</span><span>24:00</span>
            </div>
        </div>

        <div class="card">
            <div class="card-title">
                自定义电价配置 
                <span style="font-weight: normal; font-size: 12px; color: var(--primary);">+ 新增时段</span>
            </div>
            
            <div class="config-item">
                <div class="dot" style="background: var(--peak);"></div>
                <div class="type-name">高峰时段</div>
                <div class="time-range">11:00-16:00 / 19:00-22:00</div>
                <input type="number" class="price-input" value="1.25"> <small>&nbsp;元</small>
            </div>

            <div class="config-item">
                <div class="dot" style="background: var(--flat);"></div>
                <div class="type-name">平值时段</div>
                <div class="time-range">08:00-11:00 / 16:00-19:00</div>
                <input type="number" class="price-input" value="0.85"> <small>&nbsp;元</small>
            </div>

            <div class="config-item">
                <div class="dot" style="background: var(--valley);"></div>
                <div class="type-name">谷值时段</div>
                <div class="time-range">22:00-次日08:00</div>
                <input type="number" class="price-input" value="0.42"> <small>&nbsp;元</small>
            </div>

            <div class="tip">
                * 更改电价后，系统将从下一次仪表上报读数时开始按新费率扣费。历史账单不受影响。
            </div>
        </div>

        <div class="card">
            <div class="card-title">自动切换策略</div>
            <div style="display: flex; justify-content: space-between; align-items: center; font-size: 14px;">
                <span>法定节假日自动执行“谷电”优惠</span>
                <input type="checkbox" checked style="width: 20px; height: 20px;">
            </div>
        </div>
    </div>

    <div class="footer-action">
        <button class="btn-save" onclick="alert('配置已下发至智能电表，立即生效')">保存并应用</button>
    </div>

</body>
</html>
