<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>能源预付费管理系统 - 原型</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f7f6; margin: 0; display: flex; }
        /* 侧边栏 */
        .sidebar { width: 240px; background: #2c3e50; color: white; height: 100vh; padding: 20px; }
        .sidebar h2 { font-size: 18px; border-bottom: 1px solid #455a64; padding-bottom: 10px; }
        .menu-item { padding: 12px 0; cursor: pointer; color: #bdc3c7; }
        .menu-item.active { color: #fff; font-weight: bold; }

        /* 主体内容 */
        .main-content { flex: 1; padding: 25px; overflow-y: auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        
        /* 卡片统计 */
        .stats-container { display: flex; gap: 20px; margin-bottom: 25px; }
        .card { background: white; padding: 20px; border-radius: 8px; flex: 1; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .card h3 { margin: 0; color: #7f8c8d; font-size: 14px; }
        .card p { font-size: 24px; font-weight: bold; margin: 10px 0 0; color: #2c3e50; }

        /* 表格区域 */
        .table-section { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { text-align: left; padding: 12px; border-bottom: 1px solid #eee; }
        th { background: #f8f9fa; }
        
        /* 状态标签 */
        .status { padding: 4px 8px; border-radius: 4px; font-size: 12px; }
        .status-danger { background: #ffebee; color: #c62828; }
        .status-success { background: #e8f5e9; color: #2e7d32; }

        /* 配置弹窗模拟 */
        .config-panel { border-left: 4px solid #3498db; background: #eef7fd; padding: 15px; margin-bottom: 20px; }
    </style>
</head>
<body>

<div class="sidebar">
    <h2>能源管理系统</h2>
    <div class="menu-item">仪表盘</div>
    <div class="menu-item active">预付费管理</div>
    <div class="menu-item">能耗分析</div>
    <div class="menu-item">通知服务配置</div>
    <div class="menu-item">设备远程控制</div>
</div>

<div class="main-content">
    <div class="header">
        <h1>用户预付费管理</h1>
        <button style="background: #3498db; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer;">+ 账户充值</button>
    </div>

    <div class="config-panel">
        <strong>模块状态：</strong> 预付费管理 [开启] | 微信充值授权 [开启] | 短信推送服务 [开启 (余额: 4500条)]
    </div>

    <div class="stats-container">
        <div class="card">
            <h3>总预收金额</h3>
            <p>¥ 128,450.00</p>
        </div>
        <div class="card">
            <h3>今日扣费 (水/电/空调)</h3>
            <p>¥ 3,120.50</p>
        </div>
        <div class="card">
            <h3>欠费告警用户</h3>
            <p style="color: #e74c3c;">12 户</p>
        </div>
    </div>

    <div class="table-section">
        <h3>用户明细及操作</h3>
        <table>
            <thead>
                <tr>
                    <th>房号/用户名</th>
                    <th>账户余额</th>
                    <th>电能状态</th>
                    <th>水耗状态</th>
                    <th>最近充值时间</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>A栋-101 (张三)</td>
                    <td><span style="color: #2e7d32; font-weight: bold;">¥ 520.00</span></td>
                    <td><span class="status status-success">运行中</span></td>
                    <td><span class="status status-success">运行中</span></td>
                    <td>2023-10-25</td>
                    <td><button>账单</button> <button>通知</button></td>
                </tr>
                <tr>
                    <td>B栋-302 (李四)</td>
                    <td><span style="color: #c62828; font-weight: bold;">¥ -12.50</span></td>
                    <td><span class="status status-danger">已强制切断</span></td>
                    <td><span class="status status-success">运行中</span></td>
                    <td>2023-09-15</td>
                    <td><button>催缴</button> <button style="color: red;">恢复供能</button></td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
